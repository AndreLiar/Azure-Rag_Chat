name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: andreliar/azure-rag-chat-backend
  FRONTEND_IMAGE_NAME: andreliar/azure-rag-chat-frontend
  AZURE_RESOURCE_GROUP: ragchat12481-rg
  AZURE_CONTAINER_APP_NAME: ragchat12481-backend
  AZURE_STATIC_WEB_APP_NAME: zealous-grass-0c5e85103

jobs:
  # ==============================================================================
  # PHASE 1: CHANGE DETECTION
  # ==============================================================================
  
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      any-code: ${{ steps.any-code.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

      - name: Check if any code changed
        id: any-code
        run: |
          if [[ "${{ steps.changes.outputs.backend }}" == "true" || "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  # ==============================================================================
  # PHASE 2: PARALLEL TESTING
  # ==============================================================================

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8

      - name: Check code formatting
        run: |
          cd backend
          black --check --diff .

      - name: Run linting
        run: |
          cd backend
          flake8 . --count --max-complexity=10 --max-line-length=88 --statistics

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript check
        run: |
          cd frontend
          npm run type-check

      - name: Build application
        run: |
          cd frontend
          npm run build

      - name: Run tests
        run: |
          cd frontend
          npm run test:ci

  # ==============================================================================
  # PHASE 3: BUILD & PUSH IMAGES
  # ==============================================================================

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, test-frontend]
    if: |
      always() && 
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.any-code == 'true' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        if: needs.detect-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image  
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # PHASE 4: DEPLOY TO PRODUCTION
  # ==============================================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: |
      always() && 
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.any-code == 'true' &&
      needs.build-images.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Azure Container Apps
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
            --set-env-vars \
              ENVIRONMENT=production \
              OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              AZURE_SEARCH_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
              AZURE_SEARCH_KEY="${{ secrets.AZURE_SEARCH_KEY }}" \
              AZURE_STORAGE_ACCOUNT_NAME="${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
              LOG_LEVEL=INFO

      - name: Deploy Frontend to Azure Static Web Apps
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "out"

      - name: Health Check
        run: |
          echo "Waiting for services to be ready..."
          sleep 30
          
          # Basic health check
          echo "✅ Deployment completed"

      - name: Notify Success
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Frontend URL: https://${{ env.AZURE_STATIC_WEB_APP_NAME }}.3.azurestaticapps.net"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          echo "Check the logs above for details"